name: go

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Build sdkit.exe onto PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bin" | Out-Null
          go build -o "$env:RUNNER_TEMP\bin\sdkit.exe" ./cmd/sdkit
          "$env:RUNNER_TEMP\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Windows smoke run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-smoke.ps1
