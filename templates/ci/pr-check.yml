# Example only (not installed by init): run the cheap PR checks of a repo that vendors the kit. The full suite and fixture benchmark belong to a release / milestone job.
# Needs the sdkit binary: this example builds it from the repo itself (the kit repo). Another repo installs a pinned release with checksum as in github-actions.yml.
name: pr-check
on: [pull_request]
jobs:
  cheap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -o "$RUNNER_TEMP/sdkit" ./cmd/sdkit
      - run: PATH="$RUNNER_TEMP:$PATH" sdkit pr check --base origin/${{ github.base_ref }}
  milestone:
    if: startsWith(github.ref, 'refs/tags/')   # tags / releases only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -o "$RUNNER_TEMP/sdkit" ./cmd/sdkit
      - run: PATH="$RUNNER_TEMP:$PATH" sdkit pr check --milestone
