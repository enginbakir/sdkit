# spec-driven-kit: server-side gate. Fails a merge request whose code change has no committed attestation for exactly that diff
# (and, for medium/high risk, no independent verifier PASS). Local hooks can be skipped with --no-verify; this cannot.
# The gate installs the sdkit release pinned by the base branch's copy of this file (checksum verified) and reads the base branch's settings,
# so a pull request cannot edit the check that judges it. Raise SDKIT_VERSION by merging a change to it into the base branch.
# Protect __KIT_DIR__/ and this CI file with CODEOWNERS: the attestation is a committed file, it proves the flow ran for this diff, not who ran it.
# Merge this job into your existing .gitlab-ci.yml if you have one. Keep your own build/test jobs next to it.
# Make it required: Settings > Merge requests > "Pipelines must succeed".
spec-driven-gate:
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    SDKIT_VERSION: "__SDKIT_VERSION__"
  script:
    - apk add --no-cache curl
    # merged-results pipelines check out a merge commit: the attestation is bound to the source branch's own content
    - if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-}" ]; then git checkout -q "$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"; fi
    - git fetch -q origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      v="$(git show "$BASE:.gitlab-ci.yml" 2>/dev/null || cat ".gitlab-ci.yml")"; v="$(printf '%s\n' "$v" | sed -n 's/^[# ]*SDKIT_VERSION: *"*\([0-9][^" ]*\).*/\1/p' | head -1)"
      [ -n "$v" ] || { echo "no SDKIT_VERSION in the gate file"; exit 1; }
      d="$(mktemp -d)"; u="https://github.com/wecii/sdkit/releases/download/v$v"; a="sdkit_${v}_linux_amd64.tar.gz"
      curl -fsSL -o "$d/$a" "$u/$a" && curl -fsSL -o "$d/checksums.txt" "$u/checksums.txt"
      (cd "$d" && grep " $a\$" checksums.txt | sha256sum -c - && tar -xzf "$a" sdkit)
      PATH="$d:$PATH" VERIFY_BASE="$BASE" sdkit sdd ci-check
