<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>sdkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1b1f24; }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; min-height: 6rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  button { font: inherit; padding: .4rem 1rem; margin-right: .5rem; cursor: pointer; }
  #steps { display: flex; gap: .3rem; flex-wrap: wrap; margin: 1rem 0; }
  .step { padding: .2rem .6rem; border-radius: 1rem; background: #e6e8eb; font-size: .85rem; }
  .step.started { background: #fff3c4; }
  .step.done { background: #c9f0d1; }
  .msg { white-space: pre-wrap; margin: .6rem 0; }
  .q { border: 2px solid #3b82f6; border-radius: .5rem; padding: .8rem; margin: 1rem 0; }
  .q label { display: block; margin: .25rem 0; }
  .q small { color: #5b6470; }
  .fail { color: #b42318; }
  details { margin-top: 1.5rem; color: #5b6470; font-size: .85rem; }
</style>
</head>
<body>
<h1>sdkit</h1>
<div id="start">
  <p>Ne yapmak istiyorsun?</p>
  <textarea id="task" placeholder="Örn: odeme-akisi ön-spec'inden spec üret"></textarea>
  <p><button id="go">Başlat</button></p>
</div>
<div id="steps"></div>
<div id="log"></div>
<div id="questions"></div>
<p><button id="stop" hidden>Durdur</button></p>
<details><summary>Ayrıntılar</summary><pre id="tools"></pre></details>
<script>
const key = new URLSearchParams(location.search).get('k');
const H = { 'X-Sdkit-Key': key, 'Content-Type': 'application/json' };
const $ = id => document.getElementById(id);
const steps = {};
const seen = new Set();

function renderStep(e) {
  let el = steps[e.step];
  if (!el) {
    el = steps[e.step] = document.createElement('span');
    $('steps').appendChild(el);
  }
  el.className = 'step ' + e.state;
  el.textContent = e.step + '/' + e.total + ' ' + e.name;
}

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.textContent = text;
  $('log').appendChild(d);
}

function on(e) {
  if (e.kind === 'step') renderStep(e);
  else if (e.kind === 'text') addMsg(e.text);
  else if (e.kind === 'tool') $('tools').textContent += e.name + ': ' + e.text + '\n';
  else if (e.kind === 'result') {
    addMsg(e.text || (e.failed ? 'Durdu.' : 'Bitti.'), e.failed ? 'fail' : '');
    $('stop').hidden = true; $('start').hidden = false;
  } else if (e.kind === 'status') {
    if (e.name === 'question') loadQuestions();
    if (e.text === 'started') { $('start').hidden = true; $('stop').hidden = false; }
  }
}

async function loadQuestions() {
  const qs = await (await fetch('/api/questions', { headers: H })).json();
  for (const q of qs) {
    if (seen.has(q.id)) continue;
    seen.add(q.id);
    renderQuestion(q);
  }
}

function renderQuestion(q) {
  const box = document.createElement('div');
  box.className = 'q';
  const inputs = [];
  for (const [i, item] of q.questions.questions.entries()) {
    const p = document.createElement('p');
    p.innerHTML = '<b></b>';
    p.firstChild.textContent = item.question;
    box.appendChild(p);
    for (const o of item.options || []) {
      const l = document.createElement('label');
      const inp = document.createElement('input');
      inp.type = item.multiSelect ? 'checkbox' : 'radio';
      inp.name = 'q' + q.id + '_' + i;
      inp.value = o.label;
      l.append(inp, ' ' + o.label);
      if (o.description) { const s = document.createElement('small'); s.textContent = ' - ' + o.description; l.append(s); }
      box.appendChild(l);
      inputs.push([item.question, inp]);
    }
    const other = document.createElement('input');
    other.type = 'text'; other.placeholder = 'Başka bir cevap...';
    box.appendChild(other);
    inputs.push([item.question, other]);
  }
  const btn = document.createElement('button');
  btn.textContent = 'Gönder';
  btn.onclick = async () => {
    const answers = {};
    for (const [question, inp] of inputs) {
      const v = (inp.type === 'text') ? inp.value.trim() : (inp.checked ? inp.value : '');
      if (v) answers[question] = answers[question] ? answers[question] + ', ' + v : v;
    }
    const r = await fetch('/api/answer', { method: 'POST', headers: H, body: JSON.stringify({ id: q.id, answers }) });
    if (r.ok) box.remove(); else alert(await r.text());
  };
  box.appendChild(btn);
  $('questions').appendChild(box);
}

$('go').onclick = async () => {
  const task = $('task').value.trim();
  if (!task) return;
  const r = await fetch('/api/run', { method: 'POST', headers: H, body: JSON.stringify({ task }) });
  if (!r.ok) alert(await r.text());
};
$('stop').onclick = () => fetch('/api/stop', { method: 'POST', headers: H });

const es = new EventSource('/api/events?k=' + encodeURIComponent(key));
es.onmessage = m => on(JSON.parse(m.data));
loadQuestions();
</script>
</body>
</html>
